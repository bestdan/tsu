analyzer:
  plugins:
    - dart_code_metrics

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gql.dart"

dart_code_metrics:
  metrics:
    cyclomatic-complexity: 20
    number-of-parameters: 4
    maximum-nesting-level: 5
    lines-of-code: 100

  rules:
    - avoid-dynamic
    - avoid-unused-parameters
    - prefer-conditional-expressions
    - no-equal-then-else
    - prefer-trailing-comma

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - prefer_const_constructors
    - unnecessary_const
    - unnecessary_new
    - avoid_empty_else
    - prefer_is_empty
    - prefer_is_not_empty
