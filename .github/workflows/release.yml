name: Create Release PR

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g., 1.2.0)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if version already exists
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Error: Version v${{ env.VERSION }} already exists"
            exit 1
          fi

      - name: Build package
        run: pnpm build

      - name: Run tests
        run: pnpm test:run

      - name: Update version in package.json
        run: npm version ${{ env.VERSION }} --no-git-tag-version

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          branch: release-${{ env.VERSION }}
          base: main
          title: "chore: release version ${{ env.VERSION }}"
          body: |
            ## Release v${{ env.VERSION }}

            This PR bumps the version to ${{ env.VERSION }}.

            Once merged, a git tag will be created automatically and a GitHub Release will be published.
          commit-message: "chore: release version ${{ env.VERSION }}"
          delete-branch: true
