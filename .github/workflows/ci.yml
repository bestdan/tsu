name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      
      - name: Type check
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      
      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      
      - name: Run tests
        run: pnpm test:run
