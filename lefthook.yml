# Lefthook configuration
# See https://github.com/evilmartians/lefthook for documentation

# If you want to turn on/on verbosity or which hooks run
# you can modify .lefthook-local.yml

output:
  #- meta           # Print lefthook version
  #- summary        # Print summary block (successful and failed steps)
  #- empty_summary  # Print summary heading when there are no steps to run
  #- success        # Print successful steps
  - failure        # Print failed steps printing
  #- execution      # Print any execution logs
  #- execution_out  # Print execution output
  #- execution_info # Print `EXECUTE > ...` logging
  #- skips          # Print "skip" (i.e. no files matched)
pre-push:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,js}"
      run: |
        if [ -n "{push_files}" ]; then
          echo "{push_files}" | xargs pnpm eslint
        elif [ "${LEFTHOOK_VERBOSE}" = "1" ]; then
          echo "No files matching glob, skipping lint"
        fi
    typecheck:
      glob: "*.{ts}"
      run: |
        if [ -n "{push_files}" ]; then
          pnpm typecheck
        elif [ "${LEFTHOOK_VERBOSE}" = "1" ]; then
          echo "No TS files changed, skipping typecheck"
        fi
    build:
      glob: "*.{ts,json,yml,yaml}"
      run: pnpm build
